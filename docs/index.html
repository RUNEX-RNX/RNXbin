<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0b0f1c;
            color: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #2d3450;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <h1>⏳ Перенаправление...</h1>
        <div class="loader"></div>
        <p>Пожалуйста, подождите...</p>
    </div>
    <script>
        // Сохраняем путь, по которому пришли
        var path = window.location.pathname;
        // Перенаправляем на index.html с сохранением пути
        window.location.replace('/RNXbin/?path=' + encodeURIComponent(path));
    </script>
</body>
</html>
