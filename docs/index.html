<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RNXBin — Пастебин с соцсетями и улучшенной тёмной темой</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.2s ease, color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        /* ----- СВЕТЛАЯ ТЕМА (базовая) ----- */
        body.light {
            background: #f5f7fb;
            color: #1e293b;
        }
        body.light .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
        }
        body.light .btn-outline {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #334155;
        }
        body.light .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        body.light .paste-item {
            background: #ffffff;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        body.light .preview {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        body.light input, body.light textarea {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }
        body.light .social-menu {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
        }
        /* светлая тема: кнопка edit как основная */
        body.light .btn-edit {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            color: white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }
        body.light .btn-edit:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.4);
        }

        /* ----- ТЁМНАЯ ТЕМА (все кнопки как EDIT, кроме удаления) ----- */
        body.dark {
            background: #0b0f1c;
            color: #eef2ff;
        }
        body.dark .card {
            background: #101520;
            border: 1px solid #23283e;
        }
        body.dark .btn-outline {
            background: transparent;
            border: 1px solid #2d3450;
            color: #cbd5e6;
        }
        body.dark .btn-outline:hover {
            background: #1e243b;
            border-color: #4b5a8c;
        }
        body.dark .paste-item {
            background: #0e1322;
            border-left-color: #6c47ff;
        }
        body.dark .preview {
            background: #080c14;
            color: #bbc2e0;
            border: 1px solid #23283e;
        }
        body.dark input, body.dark textarea {
            background: #0a0e17;
            border: 1px solid #2a2f45;
            color: #eef2ff;
        }
        body.dark .social-menu {
            background: #0e1322;
            border: 1px solid #2d3450;
        }
        /* в тёмной теме все обычные кнопки получают стиль EDIT (градиент) */
        body.dark .btn:not(.btn-danger):not(.social-btn) {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            color: white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
            border: none;
        }
        body.dark .btn:not(.btn-danger):not(.social-btn):hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.4);
        }
        /* кнопка удаления остаётся красной */
        body.dark .btn-danger {
            background: #dc2626;
            color: white;
            box-shadow: none;
        }
        body.dark .btn-danger:hover {
            background: #b91c1c;
            transform: scale(0.98);
        }
        /* для кнопки выхода в профиле */
        body.dark .logout-btn {
            background: #dc2626 !important;
            color: white !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border, #2d3450);
        }
        .left-group {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .social-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.4rem 0.7rem;
            border-radius: 60px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            font-weight: 500;
        }
        .social-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .social-btn:hover {
            background: rgba(100, 100, 120, 0.2);
            transform: scale(1.02);
        }
        .logo h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.2rem;
        }

        /* Кнопки — единый стиль (базовый для светлой) */
        .btn {
            padding: 0.55rem 1.3rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            color: white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.4);
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: scale(0.98);
        }
        .btn-outline {
            background: transparent;
        }
        .card {
            border-radius: 28px;
            padding: 1.8rem;
            margin-bottom: 2rem;
        }
        .flex-row {
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .paste-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .paste-item {
            border-radius: 20px;
            padding: 1rem 1.4rem;
            cursor: pointer;
            transition: 0.1s ease;
        }
        .paste-item:hover {
            transform: scale(0.99);
            opacity: 0.9;
        }
        .paste-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.2px;
        }
        .paste-meta {
            font-size: 0.7rem;
            opacity: 0.65;
            margin-top: 0.3rem;
        }
        .preview {
            font-size: 0.75rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin-top: 10px;
            padding: 0.6rem;
            border-radius: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 100px;
            overflow-y: auto;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            backdrop-filter: blur(12px);
            color: white;
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            font-size: 0.85rem;
            z-index: 2000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        textarea, .input-field {
            width: 100%;
            border-radius: 20px;
            padding: 0.9rem 1rem;
            font-family: 'SF Mono', monospace;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            outline: none;
            transition: 0.2s;
        }
        textarea:focus, .input-field:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
        }
        .social-menu {
            position: absolute;
            top: 80px;
            left: 24px;
            width: 280px;
            border-radius: 28px;
            padding: 1rem;
            z-index: 300;
            display: none;
            flex-direction: column;
            gap: 0.7rem;
            backdrop-filter: blur(12px);
        }
        .social-menu.show {
            display: flex;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.65rem 1rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.9rem;
            background: rgba(128, 128, 128, 0.08);
        }
        .social-link:hover {
            background: rgba(128, 128, 128, 0.2);
            transform: translateX(4px);
        }
        .social-link img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        hr {
            margin: 1rem 0;
            border-color: #2d3450;
        }
    </style>
</head>

<div id="toastMsg" class="toast">📡 готово</div>

<script>
    // ------------------- ХРАНИЛИЩЕ (localStorage) -------------------
    let allPastes = [];
    let users = [];
    let currentUser = null;

    function loadStorage() {
        const savedPastes = localStorage.getItem('rnxbin_pastes_v8');
        const savedUsers = localStorage.getItem('rnxbin_users_v8');
        if(savedPastes) allPastes = JSON.parse(savedPastes);
        if(savedUsers) users = JSON.parse(savedUsers);
        else {
            users = [{ id: "u1", username: "admin", passwordHash: btoa("admin123"), theme: "light" }];
            localStorage.setItem('rnxbin_users_v8', JSON.stringify(users));
            allPastes = [];
            localStorage.setItem('rnxbin_pastes_v8', JSON.stringify(allPastes));
        }
    }
    function savePastes() { localStorage.setItem('rnxbin_pastes_v8', JSON.stringify(allPastes)); }
    function saveUsers() { localStorage.setItem('rnxbin_users_v8', JSON.stringify(users)); }
    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        t.textContent = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2200);
    }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    // ------------------- ГЛАВНАЯ ЛЕНТА -------------------
    function renderMainList() {
        const container = document.getElementById('pasteListContainer');
        if(!container) return;
        if(!allPastes.length) {
            container.innerHTML = `<div style="text-align:center; padding:2.5rem;">📭 Нет публикаций. Нажмите «➕ Добавить»</div>`;
            return;
        }
        const sorted = [...allPastes].sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
        container.innerHTML = sorted.map(p => {
            const author = users.find(u => u.id === p.authorId);
            const authorName = author ? author.username : 'anon';
            const date = p.createdAt ? new Date(p.createdAt).toLocaleString() : 'недавно';
            const preview = (p.content || '').slice(0, 130) + (p.content?.length > 130 ? '…' : '');
            return `
                <div class="paste-item" data-id="${p.id}">
                    <div class="paste-title">📄 ${escapeHtml(p.title || 'Без названия')}</div>
                    <div class="paste-meta">✍️ ${escapeHtml(authorName)} · ${date}</div>
                    <div class="preview">${escapeHtml(preview)}</div>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.paste-item').forEach(el => {
            el.addEventListener('click', () => showFullPage(el.getAttribute('data-id')));
        });
    }

    // ------------------- СТРАНИЦА ПРОСМОТРА (RAW / EDIT / DELETE) -------------------
    function showFullPage(pasteId) {
        const paste = allPastes.find(p => p.id === pasteId);
        if(!paste) { alert("Не найдено"); renderMainList(); return; }
        const isOwner = currentUser && paste.authorId === currentUser.id;

        document.body.innerHTML = `
            <div class="container" style="max-width:1000px;">
                <div style="margin-bottom:1rem;"><button class="btn btn-outline" id="backHomeBtn">← На главную</button></div>
                <div class="card">
                    <h2>📄 ${escapeHtml(paste.title || 'Без названия')}</h2>
                    <div style="opacity:0.6; margin-bottom:1rem;">${new Date(paste.createdAt).toLocaleString()}</div>
                    <pre style="background:rgba(0,0,0,0.05); padding:1rem; border-radius:20px; overflow-x:auto; white-space:pre-wrap; font-family:monospace; font-size:0.85rem;">${escapeHtml(paste.content)}</pre>
                    <div class="flex-row" style="margin-top:2rem;">
                        <button class="btn btn-outline" id="rawBtn">📄 RAW</button>
                        <button class="btn btn-outline" id="downloadBtn">⬇️ DOWNLOAD</button>
                        ${isOwner ? `<button class="btn btn-primary" id="editBtn">✏️ EDIT</button>` : ''}
                        ${isOwner ? `<button class="btn btn-danger" id="deleteBtn">🗑️ УДАЛИТЬ</button>` : ''}
                    </div>
                </div>
            </div>
        `;
        document.getElementById('backHomeBtn').onclick = () => location.reload();
        document.getElementById('rawBtn').onclick = () => {
            const blob = new Blob([paste.content], {type: 'text/plain'});
            window.open(URL.createObjectURL(blob), '_blank');
        };
        document.getElementById('downloadBtn').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([paste.content], {type: 'text/plain'}));
            a.download = `${paste.title || 'rnxbin'}.txt`;
            a.click();
        };
        if(isOwner && document.getElementById('editBtn')) {
            document.getElementById('editBtn').onclick = () => showEditPage(paste.id);
        }
        if(isOwner && document.getElementById('deleteBtn')) {
            document.getElementById('deleteBtn').onclick = () => {
                if(confirm(`Удалить "${paste.title}" навсегда?`)) {
                    const idx = allPastes.findIndex(p => p.id === paste.id);
                    if(idx !== -1) allPastes.splice(idx,1);
                    savePastes();
                    location.reload();
                }
            };
        }
    }

    // ------------------- СТРАНИЦА РЕДАКТИРОВАНИЯ -------------------
    function showEditPage(pasteId) {
        const paste = allPastes.find(p => p.id === pasteId);
        if(!paste || !currentUser || paste.authorId !== currentUser.id) {
            alert("Редактировать можно только свои записи.");
            location.reload();
            return;
        }
        document.body.innerHTML = `
            <div class="container" style="max-width:950px;">
                <div style="margin-bottom:1rem;"><button class="btn btn-outline" id="cancelEditBack">← Назад</button></div>
                <div class="card">
                    <h2>✏️ Редактирование</h2>
                    <label style="margin-top:0.5rem; display:block;">Название</label>
                    <input type="text" id="editTitle" value="${escapeHtml(paste.title)}" class="input-field">
                    <label style="margin-top:1rem; display:block;">Содержимое</label>
                    <textarea id="editContent" rows="14">${escapeHtml(paste.content)}</textarea>
                    <div class="flex-row" style="margin-top:1.5rem;">
                        <button class="btn btn-primary" id="saveEdit">💾 Сохранить</button>
                        <button class="btn btn-outline" id="cancelSave">Отмена</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('cancelEditBack').onclick = () => location.reload();
        document.getElementById('cancelSave').onclick = () => location.reload();
        document.getElementById('saveEdit').onclick = () => {
            const newTitle = document.getElementById('editTitle').value.trim();
            const newContent = document.getElementById('editContent').value;
            if(!newContent) { alert("Содержимое не может быть пустым"); return; }
            paste.title = newTitle || "📄 без названия";
            paste.content = newContent;
            savePastes();
            showFullPage(paste.id);
        };
    }

    // ------------------- СОЗДАНИЕ НОВОЙ ПУБЛИКАЦИИ -------------------
    function showCreatePage() {
        if(!currentUser) {
            alert("❗ Сначала войдите в профиль (кнопка «Профиль»)");
            showProfilePage();
            return;
        }
        document.body.innerHTML = `
            <div class="container" style="max-width:950px;">
                <div><button class="btn btn-outline" id="backHome">← На главную</button></div>
                <div class="card" style="margin-top:1rem;">
                    <h2>➕ Новая публикация</h2>
                    <input type="text" id="newTitle" placeholder="Название (необязательно)" class="input-field" style="margin-top:1rem;">
                    <textarea id="newContent" rows="12" placeholder="Вставьте ваш текст, vless:// ссылки, конфиги..."></textarea>
                    <div class="flex-row" style="margin-top:1.5rem;">
                        <button class="btn btn-primary" id="doPublish">📤 Опубликовать</button>
                        <button class="btn btn-outline" id="cancelPub">Отмена</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('backHome').onclick = () => location.reload();
        document.getElementById('cancelPub').onclick = () => location.reload();
        document.getElementById('doPublish').onclick = () => {
            const title = document.getElementById('newTitle').value.trim();
            const content = document.getElementById('newContent').value.trim();
            if(!content) { alert("Нельзя опубликовать пустой текст"); return; }
            const newId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2,8);
            allPastes.unshift({
                id: newId,
                title: title || "📜 новая запись",
                content: content,
                authorId: currentUser.id,
                createdAt: Date.now()
            });
            savePastes();
            showFullPage(newId);
        };
    }

    // ------------------- ПРОФИЛЬ (смена пароля, тема, вход/выход) -------------------
    function showProfilePage() {
        if(currentUser) {
            document.body.innerHTML = `
                <div class="container" style="max-width:550px;">
                    <div><button class="btn btn-outline" id="backHomeBtn">← На главную</button></div>
                    <div class="card" style="margin-top:1rem;">
                        <h2>👤 ${escapeHtml(currentUser.username)}</h2>
                        <div style="margin:1rem 0;">
                            <label>Новый пароль</label>
                            <input type="password" id="newPass" class="input-field">
                            <button class="btn btn-primary" id="changePassBtn" style="margin-top:0.7rem;">Сменить пароль</button>
                        </div>
                        <hr>
                        <div>
                            <label>Тема оформления</label>
                            <div class="flex-row" style="margin-top:0.6rem;">
                                <button class="btn btn-outline" id="lightThemeBtn">☀️ Светлая</button>
                                <button class="btn btn-outline" id="darkThemeBtn">🌙 Тёмная</button>
                            </div>
                        </div>
                        <hr>
                        <button class="btn btn-danger logout-btn" id="logoutBtn" style="width:100%;">🚪 Выйти</button>
                    </div>
                </div>
            `;
            document.getElementById('backHomeBtn').onclick = () => location.reload();
            document.getElementById('changePassBtn').onclick = () => {
                const newP = document.getElementById('newPass').value;
                if(!newP || newP.length<3) { alert("Пароль должен быть минимум 3 символа"); return; }
                currentUser.passwordHash = btoa(newP);
                const idx = users.findIndex(u => u.id === currentUser.id);
                if(idx !== -1) users[idx].passwordHash = btoa(newP);
                saveUsers();
                showToast("✅ Пароль изменён");
            };
            document.getElementById('lightThemeBtn').onclick = () => setTheme('light');
            document.getElementById('darkThemeBtn').onclick = () => setTheme('dark');
            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                localStorage.removeItem('rnxbin_session');
                setThemeFromUser();
                location.reload();
            };
        } else {
            document.body.innerHTML = `
                <div class="container" style="max-width:500px;">
                    <div><button class="btn btn-outline" id="backHomeBtn">← На главную</button></div>
                    <div class="card" style="margin-top:1rem;">
                        <h2>🔐 Вход / Регистрация</h2>
                        <input type="text" id="loginUser" placeholder="Логин" class="input-field" style="margin-top:1rem;">
                        <input type="password" id="loginPass" placeholder="Пароль" class="input-field" style="margin-top:0.6rem;">
                        <button class="btn btn-primary" id="doLogin" style="margin-top:1.2rem; width:100%;">Войти</button>
                        <hr>
                        <input type="text" id="regUser" placeholder="Новый логин" class="input-field">
                        <input type="password" id="regPass" placeholder="Пароль" class="input-field" style="margin-top:0.6rem;">
                        <button class="btn btn-outline" id="doRegister" style="margin-top:1.2rem; width:100%;">📝 Зарегистрироваться</button>
                    </div>
                </div>
            `;
            document.getElementById('backHomeBtn').onclick = () => location.reload();
            document.getElementById('doLogin').onclick = () => {
                const u = document.getElementById('loginUser').value;
                const p = document.getElementById('loginPass').value;
                const user = users.find(uu => uu.username === u && uu.passwordHash === btoa(p));
                if(!user) { alert("Неверный логин или пароль"); return; }
                currentUser = { id: user.id, username: user.username };
                localStorage.setItem('rnxbin_session', JSON.stringify({ id: user.id, username: user.username }));
                setThemeFromUser();
                location.reload();
            };
            document.getElementById('doRegister').onclick = () => {
                const u = document.getElementById('regUser').value.trim();
                const p = document.getElementById('regPass').value.trim();
                if(!u || u.length<3) { alert("Логин минимум 3 символа"); return; }
                if(!p || p.length<3) { alert("Пароль минимум 3 символа"); return; }
                if(users.find(uu => uu.username === u)) { alert("Такой логин уже используется"); return; }
                const newId = 'u_'+Date.now();
                users.push({ id: newId, username: u, passwordHash: btoa(p), theme: 'light' });
                saveUsers();
                currentUser = { id: newId, username: u };
                localStorage.setItem('rnxbin_session', JSON.stringify({ id: newId, username: u }));
                setThemeFromUser();
                location.reload();
            };
        }
    }

    // ------------------- УПРАВЛЕНИЕ ТЕМОЙ (тёмная: все кнопки как EDIT) -------------------
    function setTheme(theme) {
        document.body.classList.remove('light', 'dark');
        document.body.classList.add(theme);
        if(currentUser) {
            const u = users.find(u => u.id === currentUser.id);
            if(u) { u.theme = theme; saveUsers(); }
        }
        localStorage.setItem('rnxbin_global_theme', theme);
        const toggle = document.getElementById('themeToggleBtn');
        if(toggle) toggle.innerHTML = theme === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема';
        showToast(`Тема: ${theme === 'dark' ? '🌙 тёмная' : '☀️ светлая'}`);
    }
    function setThemeFromUser() {
        let theme = 'light';
        if(currentUser) {
            const u = users.find(u => u.id === currentUser.id);
            if(u && u.theme) theme = u.theme;
        } else {
            const saved = localStorage.getItem('rnxbin_global_theme');
            if(saved === 'dark') theme = 'dark';
        }
        document.body.classList.remove('light', 'dark');
        document.body.classList.add(theme);
        const toggle = document.getElementById('themeToggleBtn');
        if(toggle) toggle.innerHTML = theme === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема';
    }

    // ------------------- МЕНЮ СОЦСЕТЕЙ -------------------
    function initSocialMenu() {
        const btn = document.getElementById('socialMenuBtn');
        const menu = document.getElementById('socialMenu');
        if(btn && menu) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if(!menu.contains(e.target) && e.target !== btn) menu.classList.remove('show');
            });
        }
    }

    // ------------------- ЗАПУСК -------------------
    function initSession() {
        const sess = localStorage.getItem('rnxbin_session');
        if(sess) {
            try {
                const obj = JSON.parse(sess);
                const found = users.find(u => u.id === obj.id && u.username === obj.username);
                if(found) currentUser = { id: found.id, username: found.username };
            } catch(e) {}
        }
    }
    function start() {
        loadStorage();
        initSession();
        setThemeFromUser();
        renderMainList();
        document.getElementById('createBtn').onclick = () => showCreatePage();
        document.getElementById('profileBtn').onclick = () => showProfilePage();
        document.getElementById('themeToggleBtn').onclick = () => {
            const isDark = document.body.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        };
        initSocialMenu();
    }
    start();
</script>
</body>
</html>
